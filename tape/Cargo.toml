[package]
name = "oxide-tape"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "OXIDE — stereo tape saturation with a GPUI tape-deck preview"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "oxide-ui"
path = "src/main.rs"
required-features = ["ui"]

[features]
default = ["plugin"]
plugin = ["dep:nih_plug"]
ui = ["dep:gpui", "dep:cpal"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", optional = true }
gpui = { version = "=0.2.2", optional = true }
cpal = { version = "0.15", optional = true }

[workspace]
members = ["xtask"]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0
