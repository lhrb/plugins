[package]
name = "audio-test-reference"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Slice 1 CLAP and embedded GPUI experiment; not a certified reference"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "audio-test-reference-editor"
path = "src/bin/editor.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:x11rb"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false }
libc = "=0.2.183"
gpui = { version = "=0.2.2", default-features = false, features = ["x11", "font-kit"], optional = true }
x11rb = { version = "0.13", optional = true }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1

[lints.clippy]
undocumented_unsafe_blocks = "warn"
