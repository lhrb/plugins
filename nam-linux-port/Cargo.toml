[package]
name = "nam-linux-port"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Linux CLAP/VST3 amp modeler using the official NAM core and an embedded GPUI editor"

[lib]
name = "nam_linux_port"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nam-linux-editor"
path = "src/bin/nam-editor.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:x11rb"]

[dependencies]
nih_plug = { path = "vendor/nih-plug" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-queue = "0.3"
libc = "=0.2.183"
gpui = { version = "=0.2.2", default-features = false, features = ["x11", "font-kit"], optional = true }
x11rb = { version = "0.13", optional = true }

[build-dependencies]
cmake = "0.1"

[workspace]
members = ["xtask"]
exclude = ["vendor/nih-plug"]

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1

[lints.clippy]
undocumented_unsafe_blocks = "warn"
