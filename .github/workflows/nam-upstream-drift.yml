name: NAM upstream drift
on:
  schedule:
    - cron: "20 8 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned core against upstream main
        run: python3 nam-linux-port/scripts/update-core.py --check
