name: NAM Linux verification
on:
  push:
    paths: ["nam-linux-port/**", ".github/workflows/nam-linux-port.yml"]
  pull_request:
    paths: ["nam-linux-port/**", ".github/workflows/nam-linux-port.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: nam-linux-port
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libasound2-dev libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev libvulkan1
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --no-default-features --lib
      - run: cargo check --locked --all-targets
      - name: Native allocation regression
        run: |
          cmake -S native -B target/native-tests -DCMAKE_BUILD_TYPE=Release -DNAM_BRIDGE_TESTS=ON
          cmake --build target/native-tests -j2
          ctest --test-dir target/native-tests --output-on-failure
      - name: CLAP processing and state smoke test
        run: |
          cargo build --locked --no-default-features --lib
          python3 tests/clap_smoke.py target/debug/libnam_linux_port.so
